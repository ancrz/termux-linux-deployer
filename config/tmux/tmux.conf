# =============================================================================
# tmux.conf — Optimized for Termux proot Ubuntu on tablet
#
# Features:
#   - Mouse support (scroll, select, resize panes)
#   - Increased scrollback buffer (50,000 lines)
#   - Vi-mode copy for keyboard navigation
#   - Sensible prefix (Ctrl-a, easier on tablet keyboards)
#   - Status bar with session/window info
#   - Automatic window renaming
#   - 256-color terminal support
# =============================================================================

# --- Prefix -------------------------------------------------------------------
# Remap prefix from Ctrl-b to Ctrl-a (easier to reach on tablet keyboards)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Mouse & Scroll -----------------------------------------------------------
# Enable mouse for scroll, pane selection, and resize
set -g mouse on

# Scrollback buffer: 50,000 lines (default is 2,000)
set -g history-limit 50000

# --- Copy Mode (vi) -----------------------------------------------------------
setw -g mode-keys vi

# Enter copy mode with prefix + [
# Navigate with vi keys (hjkl), select with v, yank with y
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Terminal -----------------------------------------------------------------
# 256 colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Faster escape (default 500ms is sluggish)
set -sg escape-time 10

# --- Windows & Panes ----------------------------------------------------------
# Start numbering at 1 (0 is far from prefix key)
set -g base-index 1
setw -g pane-base-index 1

# Auto-renumber windows when one is closed
set -g renumber-windows on

# Automatic window rename based on running command
setw -g automatic-rename on

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes with Alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# --- Status Bar ---------------------------------------------------------------
set -g status-position bottom
set -g status-style "bg=colour235,fg=colour248"
set -g status-left " #[fg=colour46]#S #[fg=colour248]| "
set -g status-right " #[fg=colour248]%H:%M "
set -g status-left-length 30
setw -g window-status-current-style "fg=colour46,bold"

# --- Session Persistence ------------------------------------------------------
# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded"
