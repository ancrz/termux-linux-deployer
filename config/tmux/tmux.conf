# =============================================================================
# tmux.conf — Optimized for Termux proot Ubuntu on tablet
#
# Features:
#   - Mouse support (scroll, select, resize panes)
#   - Increased scrollback buffer (50,000 lines)
#   - Vi-mode copy for keyboard navigation
#   - Sensible prefix (Ctrl-a, easier on tablet keyboards)
#   - Status bar with session/window info
#   - Automatic window renaming
#   - 256-color terminal support
# =============================================================================

# --- Prefix -------------------------------------------------------------------
# Remap prefix from Ctrl-b to Ctrl-a (easier to reach on tablet keyboards)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Mouse & Scroll -----------------------------------------------------------
# Enable mouse for scroll, pane selection, and resize
set -g mouse on

# Scrollback buffer: 50,000 lines (default is 2,000)
set -g history-limit 50000

# --- Copy Mode (vi) -----------------------------------------------------------
setw -g mode-keys vi

# Enter copy mode with prefix + [
# Navigate with vi keys (hjkl), select with v, yank with y
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Terminal -----------------------------------------------------------------
# 256 colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Faster escape (default 500ms is sluggish)
set -sg escape-time 10

# --- Windows & Panes ----------------------------------------------------------
# Start numbering at 1 (0 is far from prefix key)
set -g base-index 1
setw -g pane-base-index 1

# Auto-renumber windows when one is closed
set -g renumber-windows on

# Automatic window rename based on running command
setw -g automatic-rename on

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes with Alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# --- Status Bar ---------------------------------------------------------------
# Layout:
#   LEFT:  [session] | proot-ubuntu | arm64
#   CENTER: windows
#   RIGHT: code-server :port [status] | Go X.X | Node vXX | HH:MM
#
# The right side runs inline shell to check code-server health via csm.
# Updates every 15 seconds (status-interval).

set -g status-position bottom
set -g status-interval 15
set -g status-style "bg=colour235,fg=colour248"

# Left: session name + environment context
set -g status-left-length 40
set -g status-left " #[fg=colour46,bold]#S #[fg=colour240]| #[fg=colour75]proot-ubuntu #[fg=colour240]| #[fg=colour243]arm64 "

# Right: code-server status + toolchain versions + clock
set -g status-right-length 80
set -g status-right "#[fg=colour75]cs#[fg=colour240]:#[fg=colour248]#{?#{==:#{pane_current_command},csm},8443,#(curl -so /dev/null -w '%%{http_code}' http://127.0.0.1:8443/healthz 2>/dev/null || echo 'off')} #[fg=colour240]| #[fg=colour107]Go#[fg=colour243]#(go version 2>/dev/null | grep -oP '\\d+\\.\\d+' | head -1) #[fg=colour240]| #[fg=colour185]Node#[fg=colour243]#(node -v 2>/dev/null | tr -d 'v' | cut -d. -f1) #[fg=colour240]| #[fg=colour248]%H:%M "

# Window styles
setw -g window-status-current-style "fg=colour46,bold"
setw -g window-status-style "fg=colour243"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

# Pane borders
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour46"

# Message style
set -g message-style "bg=colour235,fg=colour46"

# --- Session Persistence ------------------------------------------------------
# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded"
